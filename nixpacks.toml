[phases.setup]
# Use modern nixpkgs attribute name. The legacy `nodejs-22_x` was removed
# from upstream nixpkgs and was breaking Railway builds with
# "undefined variable 'nodejs-22_x'". `nodejs_22` brings npm together.
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run railway:build"]

[start]
cmd = "npm run railway:start"
